name: Update latest posts
on:
  schedule:
    - cron: "17 5 * * *"   # daily, early morning
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always the newest version, also when a run is re-run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_latest.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet data/; then
            git config user.name "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git add data/latest.json data/stats.json
            git commit -m "Update latest posts"
            git pull --rebase origin main   # in case the site changed while this ran
            git push origin HEAD:main
          fi
